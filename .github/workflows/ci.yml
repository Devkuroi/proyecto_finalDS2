name: Integración Continua (CI) - Encuestas Cali Entrega 1

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # -------------------------------------------------------------------
  # Job 1: Pruebas Automatizadas y Validación de Código Backend
  # -------------------------------------------------------------------
  laravel-tests:
    name: Pruebas Automatizadas (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.2', '8.3']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_ci_password
          MYSQL_DATABASE: gestion_encuestas_cali_test
          MYSQL_USER: test_user
          MYSQL_PASSWORD: test_password
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Descargar Código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Entorno PHP y Extensiones
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, bcmath, zip, sqlite3, pdo_sqlite
          coverage: xdebug

      - name: Validar composer.json y composer.lock
        run: composer validate --strict

      - name: Cachear Dependencias de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Restaurar Caché de Composer
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Instalar Dependencias de Composer
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Configurar Variables de Entorno de Pruebas
        run: |
          cp .env.example .env.testing
          php artisan key:generate --env=testing

      - name: Ejecutar Migraciones y Precarga de Datos de Entrega 1
        run: php artisan migrate:fresh --seed --env=testing
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

      - name: Ejecutar Suite Completa de Pruebas PHPUnit (Req 1, 2, 3 y 4)
        run: php artisan test --env=testing
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  # -------------------------------------------------------------------
  # Job 2: Verificación de Construcción de Imagen Docker
  # -------------------------------------------------------------------
  docker-build:
    name: Validación de Empaquetado Docker
    runs-on: ubuntu-latest
    needs: [laravel-tests]

    steps:
      - name: Descargar Código (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compilar Imagen Docker (Build Test)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: encuestas-cali:ci-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
